<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote-u-Lator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        section {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: #73AD21;
        }
        input {
            margin: 5px 0;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        .custom {
            display: flex;
            flex-wrap: wrap;
            padding: 5px;
        }
    </style>

</head>
<body>
    <h1>Quote-u-Lator</h1>
    <section id="sticker-details">
        <h2>Sticker Details</h2>
        <label for="width">Width (inches):</label>
        <input type="number" id="width" value="0" step="0.1" value="">
        <label for="height">Height (inches):</label>
        <input type="number" id="height" value="0" step="0.1" value="">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" value="0">
        <div class="custom">
            <p id="per-page-result-label" style="text-align: center;"># Of Labels per Page: </p>
            <p id="per-page-result" style="text-align: center;"></p>
        </div>
        <div class="custom">
            <p id="sheet-result-label" style="text-align: center;">Sheets Required: </p>
            <p id="sheet-result" style="text-align: center;"></p>
        </div>
    </section>

    <section id="cost-details">
        <h2>Cost Details</h2>
        <label for="printing-cost">Printing Cost (per sheet):</label>
        <input type="number" id="printing-cost" value="1" step="0.01">
        <label for="cutting-cost">Cutting Cost (per sheet):</label>
        <input type="number" id="cutting-cost" value="1" step="0.01">
        <label for="handling-cost">Handling Cost (per sheet):</label>
        <input type="number" id="handling-cost" value="1" step="0.01">
        <div class="custom">
            <p id="total-cost-label" style="text-align: center;">Total Price: $</p>
            <p id="total-cost" style="text-align: center;"></p>
        </div>
        
    </section>

    <script>
        <!-- Start Section that clears fields -->
        document.getElementById('width').value=""
        document.getElementById('height').value=""
        document.getElementById('quantity').value=""
        document.getElementById('printing-cost').value="1"
        document.getElementById('cutting-cost').value="1"
        document.getElementById('handling-cost').value="1"
        document.querySelectorAll('#sticker-details input, #cost-details input').forEach(input => {
            input.addEventListener('input', () => {
                calculateSheets();
                calculateTotalCost();
            });
        });

        function calculateSheets() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const quantity = parseInt(document.getElementById('quantity').value);

            if (isNaN(width) || isNaN(height) || isNaN(quantity) || width <= 0 || height <= 0 || quantity <= 0) {
                document.getElementById('sheet-result').innerText = '';
                document.getElementById('per-page-result').innerText = '';
                return 0;
            }

            const sheetWidth = 11;
            const sheetHeight = 17;

            const stickersPerRow = Math.floor(sheetWidth / width);
            const stickersPerColumn = Math.floor(sheetHeight / height);
            const stickersPerSheet = stickersPerRow * stickersPerColumn;

            const sheetsRequired = Math.ceil(quantity / stickersPerSheet);
            document.getElementById('per-page-result').innerText = `${stickersPerSheet}`; 
            document.getElementById('sheet-result').innerText = `${sheetsRequired}`;
            return sheetsRequired;
        }

        function calculateTotalCost() {
            const sheetsRequired = calculateSheets();
            const printingCost = parseFloat(document.getElementById('printing-cost').value);
            const cuttingCost = parseFloat(document.getElementById('cutting-cost').value);
            const handlingCost = parseFloat(document.getElementById('handling-cost').value);

            if (sheetsRequired === 0 || isNaN(printingCost) || isNaN(cuttingCost) || isNaN(handlingCost)) {
                document.getElementById('total-cost').innerText = '';
                return;
            }

            const totalCost = sheetsRequired * (printingCost + cuttingCost + handlingCost);
            document.getElementById('total-cost').innerText = `${totalCost.toFixed(2)}`;
        }
    </script>
</body>
</html>
