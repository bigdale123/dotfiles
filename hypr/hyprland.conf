exec-once = /nix/store/sc2vj3101xz24yq1inrjqladw88c5s21-dbus-1.14.10/bin/dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target
plugin=/nix/store/ay580zqynvd57yc2v6pcjpj5qchxdp91-hy3-0.47.0/lib/libhy3.so
$fileManager=thunar
$menu=wofi --show drun
$mod=SUPER
$terminal=kitty
source=/home/dylan/.config/hypr/monitors.conf
general {
  layout=hy3
}
bind=$mod, return, exec, $terminal
bind=$mod, D, exec, $menu
bind=$mod_SHIFT, R, exec, hyprctl reload && killall waybar && waybar
bind=$mod_SHIFT, E, exec, wlogout
bind=$mod_SHIFT, Q, hy3:killactive
bind=$mod, F, fullscreen
bind=$mod, SPACE, togglefloating
bind=,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bind=,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind=,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=$mod, s, hy3:changegroup, toggletab
bind=$mod_SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy
bind=$mod_SHIFT, c, exec, hyprpicker -a
bind=$mod_CTRL_SHIFT, h, exec, setxkbmap -layout us,il -variant ,biblical && xkb-switch -s 'il(biblical)' && notify-send 'Hebrew Mode'
bind=$mod_CTRL_SHIFT, u, exec, setxkbmap -layout us,il -variant ,biblical && xkb-switch -s us && notify-send 'America Mode'
bind=$mod, LEFT, hy3:movefocus, l
bind=$mod, RIGHT, hy3:movefocus, r
bind=$mod, UP, hy3:movefocus, u
bind=$mod, DOWN, hy3:movefocus, d
bind=$mod_SHIFT, LEFT, hy3:movewindow, l
bind=$mod_SHIFT, RIGHT, hy3:movewindow, r
bind=$mod_SHIFT, UP, hy3:movewindow, u
bind=$mod_SHIFT, DOWN, hy3:movewindow, d
bind=$mod, 1, workspace, 1
bind=$mod, 2, workspace, 2
bind=$mod, 3, workspace, 3
bind=$mod, 4, workspace, 4
bind=$mod, 5, workspace, 5
bind=$mod, 6, workspace, 6
bind=$mod, 7, workspace, 7
bind=$mod, 8, workspace, 8
bind=$mod, 9, workspace, 9
bind=$mod, 0, workspace, 10
bind=$mod_SHIFT, 1, hy3:movetoworkspace, 1
bind=$mod_SHIFT, 2, hy3:movetoworkspace, 2
bind=$mod_SHIFT, 3, hy3:movetoworkspace, 3
bind=$mod_SHIFT, 4, hy3:movetoworkspace, 4
bind=$mod_SHIFT, 5, hy3:movetoworkspace, 5
bind=$mod_SHIFT, 6, hy3:movetoworkspace, 6
bind=$mod_SHIFT, 7, hy3:movetoworkspace, 7
bind=$mod_SHIFT, 8, hy3:movetoworkspace, 8
bind=$mod_SHIFT, 9, hy3:movetoworkspace, 9
bind=$mod_SHIFT, 0, hy3:movetoworkspace, 10
bind=$mod_CTRL_SHIFT, LEFT, movecurrentworkspacetomonitor, l
bind=$mod_CTRL_SHIFT, RIGHT, movecurrentworkspacetomonitor, r
bindm=$mod, mouse:272, hy3:movewindow
bindm=$mod, mouse:273, resizewindow
exec-once=waybar
exec-once=nm-applet
exec-once=dunst -config ~/.config/dunst/dunstrc
exec-once=vesktop
exec-once=seafile-applet
exec-once=hyprpaper
windowrulev2=opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2=noanim, class:^(xwaylandvideobridge)$
windowrulev2=noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2=maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2=noblur, class:^(xwaylandvideobridge)$
windowrulev2=nofocus, class:^(xwaylandvideobridge)$
